        - generic [ref=f3e77]:
          - generic [ref=f3e78]:
            - heading "页面功能简介" [level=4] [ref=f3e79]
            - paragraph [ref=f3e80]: 基于测试模块拆分结果生成结构化测试用例，页面分为“用例生成设置”和“生成模块”两个页签，支持全局要求配置、按模块生成、导出、入库与转执行。
          - generic [ref=f3e81]:
            - heading "操作流程" [level=4] [ref=f3e82]
            - list [ref=f3e83]:
              - listitem [ref=f3e84]: 从“测试模块拆分”或“缺失模块视图”进入时，会自动带入模块列表。
              - listitem [ref=f3e85]: 在 【用例生成设置】 页签点击生成操作区按钮。
              - listitem [ref=f3e86]: 点击 【全模块直接生成】 / 【全模块补全生成】 / 【仅补全用例】 后，会先打开右侧抽屉填写“额外要求填写”，再选择边界、移动端与特殊场景要求，确认后才真正执行生成。
              - listitem [ref=f3e87]: 切到 【生成模块】 页签后，点击模块卡片中的 【生成用例】 会打开统一抽屉；可在“【全局配置优先】 / 【独立配置优先】 / 【补全生成】”三个页签间切换，再确认执行。
              - listitem [ref=f3e88]: 若选择 【补全生成】 页签，只会基于当前模块的生成建议与已有结果补充，不继承全局或独立配置勾选。
              - listitem [ref=f3e89]: 入库前先在入库操作区第一部分点击 【全模块用例视图】，集中查看并勾选用例。
              - listitem [ref=f3e90]: 再在第二部分切换“【新用例入库】 / 【追加到已有旧用例】”，页面只展示当前方式对应的操作区。
              - listitem [ref=f3e91]: 选择新用例模式时，可继续配置“直接入库 / 入库并转到执行”；选择追加模式时，使用 【旧用例追加入库】。
              - listitem [ref=f3e92]: 可按需导出 TXT / XMind 文件或返回测试模块拆分继续调整。
          - generic [ref=f3e93]:
            - heading "生成规则与区别" [level=4] [ref=f3e94]
            - list [ref=f3e95]:
              - listitem [ref=f3e96]: 【额外要求填写】：非必填，位于生成抽屉中，填写后会与基础提示词、选项提示词一起拼接给模型。
              - listitem [ref=f3e97]: 【是否需要考虑边界 / 移动设备操作 / 特殊场景】：位于右侧生成抽屉内，默认全部不勾选；每个勾选项都会附带独立提示词部件。
              - listitem [ref=f3e98]: 【生成用例】：对单个模块打开统一抽屉；“全局配置优先”会沿用已确认的全局设置，“独立配置优先”只在当前模块本次生成生效且优先于全局。
              - listitem [ref=f3e99]: 【补全生成】：位于模块生成抽屉页签内，仅对已有结果的模块补充用例，不覆盖原结果，也不继承全局或模块独立勾选。
              - listitem [ref=f3e100]: 【全模块直接生成】：对未生成中的模块批量执行“生成用例”；存在已生成数据时会二次确认，取消则全部不执行。
              - listitem [ref=f3e101]: 【全模块补全生成】：仅对已有结果且未生成中的模块批量补全，无可补全模块时不可点击。
              - listitem [ref=f3e102]: 【仅补全用例】：只执行填写了“生成建议”的模块，适合局部补充或重跑。
              - listitem [ref=f3e103]: 模块生成中会被跳过；全部生成中时全模块按钮不可点击。
          - generic [ref=f3e104]:
            - heading "必要说明" [level=4] [ref=f3e105]
            - list [ref=f3e106]:
              - listitem [ref=f3e107]: 【生成模块】 页签下每行展示两个模块；左侧 xmind 用例生成进度会展示 XMind 生成页签摘要，点击后可直接打开对应页签。
              - listitem [ref=f3e108]: 【全模块用例视图】：入库前的必做步骤，用于汇总当前用例并完成勾选。
              - listitem [ref=f3e109]: 【新用例入库】 / 【追加到已有旧用例】：用于切换入库方式，只展示当前选择对应的操作区。
              - listitem [ref=f3e110]: 【旧用例追加入库】：将勾选用例追加到已存在的用例文件。
              - listitem [ref=f3e111]: 【导出全部用例TXT】 / 【导出全部勾选用例XMind】：导出当前结果用于外部共享。
